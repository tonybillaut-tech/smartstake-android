
name: Build SmartStake AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir -p www assets
          echo '<html><meta http-equiv="refresh" content="0;url=https://streamlit.app"></html>' > www/index.html
          cp *.jpg assets/icon.png || true
          npm init -y && npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "SmartStake" "com.tonybillaut.smartstake" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android || true
          sed -i 's|"webDir": "www"|"webDir": "www", "server": {"url": "https://streamlit.app"}|' capacitor.config.json
          npx cap sync android && cd android && chmod +x gradlew && ./gradlew bundleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartStake-PlayStore-Files
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            
