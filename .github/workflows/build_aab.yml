name: Build SmartStake AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          mkdir -p www assets
          echo '<html><meta http-equiv="refresh" content="0;url=https://smartstake-app.streamlit.app/"></html>' > www/index.html
          cp *.jpg assets/icon.png || true
          npm init -y && npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "SmartStake" "com.tonybillaut.smartstake" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android || true
          sed -i 's|"webDir": "www"|"webDir": "www", "server": {"url": "https://smartstake-app.streamlit.app/"}|' capacitor.config.json
          npx cap sync android
          echo 'dependencies { implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")) }' >> android/app/build.gradle
          rm -f android/app/release.jks
          keytool -genkeypair -noprompt -keystore android/app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias smartstake -storepass Smart2026 -keypass Smart2026 -dname "CN=Tony Billaut,O=SmartStake,C=FR"
          cd android && chmod +x gradlew
          ./gradlew assembleDebug bundleRelease -x lintVitalAnalyzeRelease --no-daemon -Pandroid.injected.signing.store.file=$PWD/app/release.jks -Pandroid.injected.signing.store.password=Smart2026 -Pandroid.injected.signing.key.alias=smartstake -Pandroid.injected.signing.key.password=Smart2026
      - uses: actions/upload-artifact@v4
        with:
          name: SmartStake-PlayStore-Files
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/release.jks
            
