name: Build SmartStake AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          mkdir -p www assets
          cat << 'EOF' > www/index.html
          <!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#064e3b;color:#fff;font-family:sans-serif}</style></head><body><h2>⚽ SmartStake</h2><p>Chargement sécurisé...</p></body></html>
          EOF
          cp *.jpg assets/icon.png || true
          npm init -y && npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          npx cap init "SmartStake" "com.tonybillaut.smartstake" --web-dir www
          node -e 'const fs=require("fs");fs.writeFileSync("capacitor.config.json",JSON.stringify({appId:"com.tonybillaut.smartstake",appName:"SmartStake",webDir:"www",server:{url:["ht","tps:","//","smartstake-app.streamlit.app/?platform=android"].join(""),cleartext:false,allowNavigation:["smartstake-app.streamlit.app","*.streamlit.app"]}},null,2));'
          npx cap add android
          sed -i 's/minSdkVersion = [0-9]\+/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/versionCode 1/versionCode 2/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.1"/g' android/app/build.gradle
          npx capacitor-assets generate --android || true
          npx cap sync android
          echo 'dependencies { implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")) }' >> android/app/build.gradle
          cp release.jks android/app/release.jks
          cd android && chmod +x gradlew
          ./gradlew assembleDebug bundleRelease -x lintVitalAnalyzeRelease --no-daemon -Pandroid.injected.signing.store.file=$PWD/app/release.jks -Pandroid.injected.signing.store.password=Smart2026 -Pandroid.injected.signing.key.alias=smartstake -Pandroid.injected.signing.key.password=Smart2026
      - uses: actions/upload-artifact@v4
        with:
          name: SmartStake-PlayStore-Files
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/release.jks
            
